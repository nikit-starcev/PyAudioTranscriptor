name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Отменяем предыдущий прогон для той же ветки/PR, чтобы не тратить раннеры впустую.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pytest / ruff / mypy (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs выводит версию из git-тегов: нужна вся история и теги.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Use CPU-only PyTorch in CI
        # Проверкам не нужен CUDA: CUDA-колёса torch весят гигабайты и лишь
        # замедляют установку. Переводим индекс torch на CPU-сборку; uv.lock
        # остаётся источником версий (свежесть проверена выше), поэтому --frozen
        # здесь не используем — окружение пересобирается под CPU-индекс.
        run: sed -i 's#https://download.pytorch.org/whl/cu126#https://download.pytorch.org/whl/cpu#' pyproject.toml

      - name: Install project and dev tools
        run: uv sync --group dev --all-extras --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Pytest
        run: uv run --no-sync pytest

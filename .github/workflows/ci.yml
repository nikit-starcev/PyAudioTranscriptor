name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Отменяем предыдущий прогон для той же ветки/PR, чтобы не тратить раннеры впустую.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pytest / ruff / mypy (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs выводит версию из git-тегов: нужна вся история и теги.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: uv sync --group dev --all-extras --frozen --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

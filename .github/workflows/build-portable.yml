name: Build portable bundle

on:
  # Вручную — для отладки сборки без выпуска тега.
  workflow_dispatch:
  # По тегам vX.Y.Z — вместе с Release (release.yml), но не на каждый push,
  # чтобы не тратить раннеры: сборка тянет PyTorch и занимает десятки минут.
  push:
    tags:
      - "v*"

# Собираем бандлы под каждую host-ОС: PyInstaller не умеет кросс-сборку,
# поэтому runner = целевая ОС. Секреты не нужны — модели не качаются.
#
# `contents: write` нужен только для загрузки ассетов в GitHub Release при
# запуске по тегу; `workflow_dispatch` релиз не трогает (только artifact).
permissions:
  contents: write

# Один прогон на ref; не отменяем идущую сборку тега (её результат нужен).
concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    name: ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # PyInstaller + тяжёлые зависимости (PyTorch и т.п.) — с запасом по времени.
    timeout-minutes: 90
    env:
      # UTF-8 stdout на Windows-консоли (cp1252): скрипт печатает кириллицу.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: x86_64
          - runner: windows-latest
            target: windows
            arch: x86_64
          # Apple Silicon (arm64). Intel Mac (x86_64) не поддерживается.
          - runner: macos-14
            target: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs выводит версию из git-тегов: нужна вся история и теги.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        # Ставим именно системный `python` 3.12, а не `uv run`: сборщик
        # (scripts/build_portable.py) сам создаёт изолированное CPU-окружение.
        # `uv sync`/`uv run` здесь недопустимы — они тянут CUDA-сборку torch
        # (индекс cu126 по умолчанию на Linux/Windows, см. pyproject.toml).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable bundle
        run: python scripts/build_portable.py --target ${{ matrix.target }} --out dist

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/audio-transcriber/
          if-no-files-found: error
          retention-days: 14

      - name: Resolve version
        id: version
        shell: bash
        # Версия для имён релизных файлов берётся из тега (vX.Y.Z -> X.Y.Z).
        # При ручном запуске без тега — fallback из git describe (в релиз
        # такие файлы всё равно не попадают, см. условия ниже).
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Package bundle (tar.gz)
        # Portable-бандл — каталог; в Release кладём его одним архивом.
        # Linux/macOS: tar.gz. Архив кладём в корень checkout, не в dist,
        # чтобы он не попал ни в бандл, ни в artifact-загрузку выше.
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          archive="audio-transcriber-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C dist audio-transcriber
          echo "Создан архив: ${archive}"

      - name: Package bundle (zip)
        # Windows-бандл пакуем в zip штатным bsdtar (System32\tar.exe):
        # он корректно тянет большие каталоги, в отличие от Compress-Archive.
        # `-a` выбирает формат по суффиксу `.zip`; сжатие задаём явно (deflate),
        # чтобы архив не получился несжатым.
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "audio-transcriber-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ matrix.arch }}.zip"
          tar -a -c -f $archive --options zip:compression=deflate -C dist audio-transcriber
          Write-Host "Создан архив: $archive"

      - name: Upload bundle to GitHub Release
        # Только на тег: прикладываем архив бандла к Release, который
        # параллельно создаёт release.yml. Обычные workflow-артефакты выше
        # остаются и для workflow_dispatch, и как дубль.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ext="tar.gz"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then ext="zip"; fi
          archive="audio-transcriber-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ matrix.arch }}.${ext}"
          # release.yml создаёт Release параллельно — ждём его появления
          # (до ~10 минут), затем заливаем ассет. Тело и имя релиза не трогаем.
          deadline=$((SECONDS + 600))
          until gh release view "$tag" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error::GitHub Release для тега $tag не появился за 10 минут — проверьте workflow release.yml."
              exit 1
            fi
            echo "Ожидание Release $tag (release.yml)… прошло ${SECONDS}s"
            sleep 15
          done
          gh release upload "$tag" "$archive" --clobber

# PyAudioTranscriptor — локальный веб-UI в контейнере (Linux, GPU через Vulkan).
#
# Запуск:
#   docker compose up --build
#   # затем откройте http://127.0.0.1:8790
#
# Образ самодостаточен: движки (whisper-cli, llama-server, deep-filter) уже
# внутри, модели скачиваются из UI в том ./web-data (→ /data/models), а токен
# Hugging Face задаётся в UI (мастер первого запуска) и хранится в /data.
#
# GPU (AMD/Intel через Vulkan) доступен только на Linux: контейнер получает
# /dev/dri. На macOS/Windows Docker GPU не пробрасывает — образ работает на CPU.
# Для CPU-only запуска закомментируйте секции devices/group_add.

services:
  audio-transcriber:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Версия проекта для /api/health. Пусто — берётся из .git (hatch-vcs).
        APP_VERSION: "${APP_VERSION:-}"
    image: py-audio-transcriber:latest
    container_name: py-audio-transcriber

    ports:
      # Публикуем только на localhost: веб-UI не имеет аутентификации.
      # Чтобы открыть доступ по сети (осторожно!): "8790:8790".
      - "127.0.0.1:8790:8790"

    volumes:
      # Пользовательские данные, БД задач и скачанные модели (models/).
      - ./web-data:/data
      # Библиотека образцов голоса.
      - ./voices:/data/voices
      # НЕОБЯЗАТЕЛЬНО: свой config.env. Приложение читает config.env из /app,
      # но в вашем config.env пути, скорее всего, указывают на каталоги ХОСТА
      # (llama-native/, pyannote-models/, …) — внутри контейнера их нет. Поэтому
      # по умолчанию используется встроенный контейнерный конфиг, а свою
      # конфигурацию задавайте в UI (сохраняется в ./web-data) или смонтируйте
      # config.env с валидными ВНУТРИ контейнера путями:
      #   LLM_BINARY=llama-server, WHISPER_CPP_BINARY=whisper-cli,
      #   DEEP_FILTER_BINARY=deep-filter, *_MODEL=/data/models/...
      # - ./config.env:/app/config.env:ro

    environment:
      # Каталог данных внутри контейнера (перекрывает web-data/).
      AUDIO_TRANSCRIBER_WEB_DATA: /data
      # Подогнать uid/gid процесса под владельца каталогов на хосте.
      # Нужно, если владелец ./web-data не 1000 (rootful-режим — см. README).
      # В rootless Docker / userns-remap не применяется: entrypoint там не
      # делает chown тома и запускает приложение от контейнерного root,
      # отображённого на хостового пользователя.
      # PUID: "${UID:-1000}"
      # PGID: "${GID:-1000}"

    # GPU-Vulkan (только Linux). Для работы без GPU закомментируйте.
    devices:
      - /dev/dri:/dev/dri
    # Группы для доступа к /dev/dri. Если GPU не виден, укажите числовые GID
    # хоста: `stat -c '%g' /dev/dri/renderD128` (например, group_add: ["105"]).
    group_add:
      - video
      - render

    restart: unless-stopped

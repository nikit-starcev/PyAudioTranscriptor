[project]
name = "audio-transcriber"
# Версия не хардкодится: её выводят hatch-vcs из git-тега ``vX.Y.Z``.
# Между тегами добавляется dev-суффикс (X.Y.Z.devN+gHASH), а на теге берётся
# ровно версия тега. См. ``[tool.hatch.version]`` ниже и ``RELEASING.md``.
dynamic = ["version"]
description = "Локальная CLI-утилита для транскрибации аудиозаписей с разделением говорящих (speaker diarization)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=11",
    "faster-whisper>=1.2.1",
    "pyannote-audio>=4.0.7",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "textual>=8.0.0",
    "typer>=0.27.0",
    "torch>=2.8,<2.13",
    "torchaudio>=2.8,<2.12",
    "pymorphy3>=2.0.6",
]

[project.scripts]
audio-transcriber = "audio_transcriber.cli.app:app"

# Необязательный этап шумоподавления (DeepFilterNet). Пакет собирает libDF на
# Rust и объявлен с numpy<2; в основном окружении используется numpy 2.x, а
# для Python 3.14 колёс под numpy 1.26 нет. Поэтому extras — ориентир для
# Python < 3.14, а на 3.14 пакет ставится вручную без зависимостей (см. README,
# раздел «Шумоподавление (денойз)»):
#   uv pip install --python .venv/bin/python --no-deps \
#       deepfilternet deepfilterlib appdirs loguru
# Если пакет не установлен, этап денойза мягко пропускается.
[project.optional-dependencies]
denoise = [
    "deepfilternet>=0.5.6 ; python_version < '3.14'",
]
# Веб-интерфейс (этап 1): локальный сервер 127.0.0.1 + REST API + раздача SPA.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Единственный источник версии — git-тег ``vX.Y.Z`` (PEP 440 через setuptools-scm).
# Тег → ``X.Y.Z``; после тега → ``X.Y.Z.devN+ghash``. Версии в ``pyproject.toml`` нет.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_transcriber"]

# PyTorch не публикует CUDA-сборки в основном индексе PyPI, поэтому по
# умолчанию устанавливается CPU-only пакет. Ниже torch/torchaudio явно
# направлены на CUDA-сборку PyTorch (индекс cu126) на Windows/Linux, чтобы
# --device cuda/auto работали "из коробки" на машинах с NVIDIA GPU.
# Версии torch<2.13 и torchaudio<2.12 закреплены намеренно: начиная со
# следующих версий PyTorch перестал выпускать сборки под CUDA 12.6 —
# последнюю ветку CUDA, ещё поддерживающую архитектуры Maxwell/Pascal/Volta
# (например, GTX 10xx). На macOS CUDA-сборок не существует, поэтому там
# используется обычный CPU-индекс.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: медленные тесты на реальных моделях и аудиофайлах (запуск: pytest -m integration)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Папки, которые линтер не проверяет (артефакты, кэш, окружение).
extend-exclude = ["output", ".venv"]

[tool.ruff.lint]
# Базовый набор: ошибки pycodestyle (без длины строк E501 — её ограничивает
# formatter), pyflakes, сортировка импортов (isort) и современные практики.
select = [
    "E4", "E7", "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ARG",
    "BLE",
    "RUF",
]
ignore = [
    # Кириллица в строках/комментариях — для русскоязычного проекта это норма,
    # а не случайный похожий Unicode-символ.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Typer по своей архитектуре требует вызовы typer.Option/typer.Argument прямо
# в значениях по умолчанию у аргументов команды — для этого файла B008 отключён.
"src/audio_transcriber/cli/app.py" = ["B008"]
# В тестах допустимы «магические» фикстуры и неиспользуемые аргументы-заглушки.
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.14"
# Проверяем исходники строго, но не требуем аннотаций в тестах.
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
